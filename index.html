<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IA Labs · January Edition — Procurement Academy</title>
    <meta
      name="description"
      content="Official Procurement Academy call for proposals: submit a real operational challenge and prototype an AI solution during the January IA Labs sessions."
    />
    <meta property="og:title" content="IA Labs · January Edition — Procurement Academy" />
    <meta
      property="og:description"
      content="Submit a real day-to-day Procurement bottleneck and build a functional AI prototype during our January IA Labs sessions."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" sizes="512x512" href="./assets/Icono_App_512.png" />
    <link rel="apple-touch-icon" href="./assets/Icono_App_512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          if (window.localStorage.getItem('ia_labs_theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
          var savedLang = window.localStorage.getItem('ia_labs_lang');
          if (savedLang === 'en' || savedLang === 'es') {
            document.documentElement.lang = savedLang;
          } else {
            document.documentElement.lang = 'es';
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html, body { background-color: #F0F6F6; }
      html.dark, html.dark body { background-color: #041820; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
